name: CI/CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Configure AWS credentials
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Login to ECR (GitHub runner)
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
          | docker login --username AWS --password-stdin 620057207142.dkr.ecr.us-east-1.amazonaws.com

      # Build Docker image
      - name: Build Docker Image
        run: docker build -t babita-react-app .

      # Tag Docker image
      - name: Tag Image
        run: docker tag babita-react-app:latest ${{ secrets.ECR_REPO }}:latest

      # Push to ECR
      - name: Push Image
        run: docker push ${{ secrets.ECR_REPO }}:latest

      # 🚀 Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Login to ECR from EC2
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
            | docker login --username AWS --password-stdin 620057207142.dkr.ecr.us-east-1.amazonaws.com

            # Pull latest image
            docker pull ${{ secrets.ECR_REPO }}:latest

            # Stop & remove old container
            docker stop babita-container || true
            docker rm babita-container || true

            # Run new container
            docker run -d -p 80:80 --name babita-container ${{ secrets.ECR_REPO }}:latest
